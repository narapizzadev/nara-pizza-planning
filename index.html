<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horaires Bossa Nova Café</title>
<!-- PWA v4: multi-semaines + Google Sheets -->
<style>
  :root{
    --blue:#4FC3F7; --green:#66BB6A; --orange:#FFA726; --red:#E53935;
    --grey:#757575; --pink:#F48FB1; --bg:#f4f6f9; --card:#ffffff; --text:#1c2733;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg); color:var(--text); min-height:100vh;}
  .container{max-width:520px; margin:0 auto; padding:16px;}
  header{background:#1565C0; color:#fff; padding:18px 16px; text-align:center;}
  header h1{font-size:1.3rem;}
  header .week{font-size:.95rem; opacity:.9; margin-top:4px;}
  .names{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;}
  .name-btn{padding:22px 10px; font-size:1.15rem; font-weight:600; border:none; border-radius:14px;
    background:var(--card); box-shadow:0 2px 6px rgba(0,0,0,.08); cursor:pointer; color:#1565C0;}
  .name-btn:active{transform:scale(.97);}
  .day-card{background:var(--card); border-radius:14px; box-shadow:0 2px 6px rgba(0,0,0,.07);
    margin-top:12px; overflow:hidden; display:flex;}
  .day-card .bar{width:8px; flex-shrink:0;}
  .day-card .content{padding:12px 14px; flex:1;}
  .day-card .day{font-weight:700; font-size:.95rem;}
  .day-card .hours{font-size:1.15rem; font-weight:600; margin-top:2px;}
  .day-card .pause{font-size:.85rem; color:#555; margin-top:3px;}
  .today{outline:3px solid #1565C0;}
  .today .day::after{content:" • Aujourd'hui"; color:#1565C0; font-size:.8rem;}
  .conge .hours{color:var(--grey); font-weight:500;}
  .back,.admin-link{margin-top:18px; background:none; border:none; color:#1565C0; font-size:1rem; cursor:pointer; text-decoration:underline;}
  .topbtns{display:flex; justify-content:space-between; align-items:center;}
  .summary{margin-top:14px; font-size:.9rem; color:#555; text-align:center;}
  .hours-info{background:var(--card); border-radius:14px; box-shadow:0 2px 6px rgba(0,0,0,.07); margin-top:20px; padding:14px;}
  .hours-info h3{font-size:.95rem; color:#1565C0; margin-bottom:6px;}
  .hours-info p{font-size:.88rem; margin:2px 0;}
  /* Admin */
  .admin-table{width:100%; margin-top:14px; border-collapse:collapse; font-size:.85rem;}
  select,input[type=text],input[type=password]{padding:8px; border:1px solid #ccc; border-radius:8px; font-size:.9rem; width:100%;}
  .admin-row{background:var(--card); border-radius:12px; padding:12px; margin-top:10px; box-shadow:0 2px 5px rgba(0,0,0,.06);}
  .admin-row .lbl{font-weight:700; margin-bottom:6px;}
  .admin-grid{display:grid; grid-template-columns:70px 1fr; gap:6px 8px; align-items:center;}
  .admin-grid .d{font-size:.85rem; font-weight:600;}
  .custom-input{margin-top:4px;}
  .btn{display:block; width:100%; margin-top:14px; padding:14px; font-size:1rem; font-weight:600;
    border:none; border-radius:12px; cursor:pointer;}
  .btn-primary{background:#1565C0; color:#fff;}
  .btn-secondary{background:#e3eaf3; color:#1565C0;}
  .hidden{display:none;}
  .note{font-size:.82rem; color:#666; margin-top:10px; text-align:center;}
  .legend{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; justify-content:center; font-size:.78rem;}
  .employee-actions{display:flex; gap:8px; margin-top:10px;}
  .employee-actions button{flex:1; padding:9px; border:none; border-radius:8px; cursor:pointer; font-weight:600;}
  .btn-add{background:#e8f5e9; color:#2e7d32;}
  .btn-rename{background:#e3f2fd; color:#1565c0;}
  .btn-delete{background:#ffebee; color:#c62828;}
  .legend span{display:flex; align-items:center; gap:4px;}
  .dot{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .sync-status{font-size:.78rem; text-align:center; padding:7px 12px; background:#e3f2fd; color:#0d47a1;}
  .sync-status.offline{background:#fff3e0; color:#8a4b00;}
  .sync-status.error{background:#ffebee; color:#b71c1c;}

  .week-tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0 16px;padding-bottom:3px;}
  .week-tab{min-width:74px;border:1px solid #bbdefb;background:#fff;color:#1565c0;border-radius:10px;padding:9px 10px;font-weight:700;cursor:pointer;}
  .week-tab.active{background:#1565c0;color:#fff;}
  .week-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .week-actions button{border:0;border-radius:9px;padding:10px 4px;font-weight:600;background:#e3f2fd;color:#1565c0;cursor:pointer;}
  .week-actions .danger{background:#ffebee;color:#c62828;}
  .opening-grid{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-top:8px;}
  .opening-grid label,.admin-row>label{font-size:.82rem;font-weight:600;margin-top:7px;display:block;}
  input[type=date]{padding:8px;border:1px solid #ccc;border-radius:8px;font-size:.9rem;width:100%;}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Horaires Bossa">
<link rel="apple-touch-icon" href="./icon-192.png">

</head>
<body>

<script id="schedule-data" type="application/json">
{
  "week": "Semaine du 20 au 26 juillet",
  "pin": "1234",
  "shifts": {
    "H1": {"hours": "6:30 – 15:30", "pause": "Pause : 10:00 – 10:35", "color": "blue"},
    "H2": {"hours": "8:00 – 12:30  +  15:30 – 20:30", "pause": "Pauses : 10:30 – 11:00 et 16:30 – 17:00", "color": "green"},
    "H3": {"hours": "12:30 – 21:30", "pause": "Pause : 16:00 – 16:30", "color": "orange"}
  },
  "days": ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"],
  "employees": {
    "Tais":    ["CONGE", "H1", "H3", "H3", "C:16:30 – 01:00", "C:8:30 – 12:00  +  15:30 – 20:30", "CONGE"],
    "Noji":    ["H1", "CONGE", "H1", "H2", "C:16:30 – 01:00", "C:12:00 – 21:00", "CONGE"],
    "Thiago":  ["H3", "H3", "CONGE", "H1", "C:7:30 – 16:30", "C:7:30 – 16:30", "CONGE"],
    "Antonio": ["CONGE", "CONGE", "CONGE", "CONGE", "CONGE", "CONGE", "CONGE"],
    "Rachel":  ["CONGE", "H2", "H2", "CONGE", "C:7:30 – 16:30  +  Extra 20:00 – 00:00", "CONGE", "CONGE"]
  },
  "opening": ["Lun–Jeu : 07h00 – 20h30", "Vendredi : 08h00 – 23h45", "Samedi : 08h00 – 20h00", "Dimanche : Fermé"]
}
</script>

<header>
  <h1 id="title">📅 Horaires Bossa Nova Café</h1>
  <div class="week" id="weekLabel"></div>
</header>

<div id="syncStatus" class="sync-status offline">Mode local — connexion Firebase en cours…</div>
<div class="container" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
const STORAGE_KEY = "horaires_data_v4";
const DAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const embeddedLegacy = JSON.parse(document.getElementById("schedule-data").textContent);
let db = null;
let auth = null;
let currentView = { type: "home" };
let remoteDocumentExists = false;

function mondayISO(date = new Date()) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0, 10);
}
function addDaysISO(iso, days) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function formatWeekLabel(iso) {
  const start = new Date(`${iso}T12:00:00`);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const fmt = new Intl.DateTimeFormat("fr-CH", { day: "numeric", month: "long" });
  return `Semaine du ${fmt.format(start)} au ${fmt.format(end)}`;
}
function defaultOpening() {
  return ["06:30 – 21:30", "06:30 – 21:30", "06:30 – 21:30", "06:30 – 21:30", "06:30 – 21:30", "06:30 – 21:30", "06:30 – 16:00"];
}
function legacyToWeek(legacy, id = mondayISO()) {
  const opening = defaultOpening();
  if (Array.isArray(legacy.opening) && legacy.opening.length === 7) {
    legacy.opening.forEach((v, i) => opening[i] = v);
  }
  return {
    id,
    label: legacy.week || formatWeekLabel(id),
    shifts: legacy.shifts || embeddedLegacy.shifts,
    days: DAYS,
    employees: legacy.employees || {},
    opening
  };
}
function normalizeData(raw) {
  if (raw && Array.isArray(raw.weeks)) {
    const weeks = raw.weeks.slice(0, 4).map((w, idx) => ({
      id: w.id || addDaysISO(mondayISO(), idx * 7),
      label: w.label || w.week || formatWeekLabel(w.id || addDaysISO(mondayISO(), idx * 7)),
      shifts: w.shifts || embeddedLegacy.shifts,
      days: DAYS,
      employees: w.employees || {},
      opening: Array.isArray(w.opening) && w.opening.length === 7 ? w.opening : defaultOpening()
    })).sort((a,b) => a.id.localeCompare(b.id));
    return { version: 4, selectedWeekId: raw.selectedWeekId || weeks[0]?.id, weeks };
  }
  const week = legacyToWeek(raw || embeddedLegacy);
  return { version: 4, selectedWeekId: week.id, weeks: [week] };
}

let data = normalizeData(embeddedLegacy);
try {
  const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("horaires_data_v2");
  if (saved) data = normalizeData(JSON.parse(saved));
} catch (e) { console.warn("Données locales illisibles", e); }

const app = document.getElementById("app");
const weekLabel = document.getElementById("weekLabel");
const syncStatus = document.getElementById("syncStatus");
function currentWeek() {
  return data.weeks.find(w => w.id === data.selectedWeekId) || data.weeks[0];
}
function selectWeek(id, rerender = true) {
  data.selectedWeekId = id;
  saveLocal();
  if (rerender) refreshCurrentView();
}
function setSyncStatus(message, state = "") {
  syncStatus.textContent = message;
  syncStatus.className = `sync-status ${state}`.trim();
}
function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
async function saveRemote() {
  saveLocal();
  if (!db || !auth || !auth.currentUser) return false;
  setSyncStatus("Enregistrement en cours…");
  try {
    await db.collection("planning").doc("current").set(data);
    remoteDocumentExists = true;
    setSyncStatus("Synchronisé sur tous les appareils ✓");
    return true;
  } catch (error) {
    console.error(error);
    setSyncStatus("Erreur de synchronisation — copie locale conservée", "error");
    alert("Firebase n’a pas pu enregistrer la modification.");
    return false;
  }
}
function refreshCurrentView() {
  const w = currentWeek();
  weekLabel.textContent = w?.label || "";
  if (currentView.type === "employee" && w?.employees[currentView.name]) renderEmployee(currentView.name);
  else if (currentView.type === "admin") renderAdmin();
  else renderHome();
}
function firebaseConfigured() {
  const c = window.firebaseConfig || {};
  return Boolean(c.apiKey && c.projectId && !String(c.apiKey).includes("COLLE_ICI"));
}
async function initFirebase() {
  if (!firebaseConfigured()) { setSyncStatus("Firebase à configurer — mode local", "offline"); return; }
  try {
    firebase.initializeApp(window.firebaseConfig);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(user => setSyncStatus(user ? "Connecté comme administrateur — synchronisation active" : "Planning synchronisé — consultation publique"));
    db.collection("planning").doc("current").onSnapshot(snapshot => {
      if (snapshot.exists) {
        remoteDocumentExists = true;
        data = normalizeData(snapshot.data());
        saveLocal(); refreshCurrentView();
        setSyncStatus(auth.currentUser ? "Synchronisé sur tous les appareils ✓" : "Planning à jour ✓");
      } else {
        remoteDocumentExists = false;
        setSyncStatus("Planning Firebase vide — connecte-toi en admin pour publier", "offline");
      }
    }, error => { console.error(error); setSyncStatus("Firebase inaccessible — dernière copie locale", "error"); });
  } catch (error) { console.error(error); setSyncStatus("Configuration Firebase incorrecte — mode local", "error"); }
}
function shiftInfo(code, w=currentWeek()) {
  if (!code || code === "CONGE") return { hours: "Congé", pause: "", color: "grey", conge: true };
  if (code.startsWith("C:")) return { hours: code.slice(2), pause: "", color: "red" };
  const s = w.shifts[code];
  return s ? { hours: s.hours, pause: s.pause, color: s.color } : { hours: code, pause: "", color: "grey" };
}
function todayIndexForWeek(w) {
  const today = new Date();
  const start = new Date(`${w.id}T00:00:00`);
  const diff = Math.floor((today - start) / 86400000);
  return diff >= 0 && diff <= 6 ? diff : -1;
}
function weekNavHTML() {
  return `<div class="week-tabs">${data.weeks.map(w => `<button class="week-tab ${w.id===data.selectedWeekId?'active':''}" onclick="selectWeek('${w.id}')">${new Date(w.id+'T12:00:00').toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit'})}</button>`).join("")}</div>`;
}
function openingText(value) {
  const v = String(value || "").trim();
  return !v || /ferm/i.test(v) ? "Fermé" : v;
}
function renderHome() {
  currentView = { type: "home" };
  const w = currentWeek(); if (!w) return;
  weekLabel.textContent = w.label;
  let html = weekNavHTML();
  html += '<p class="summary">Choisis ton prénom pour voir tes horaires</p><div class="names">';
  for (const name of Object.keys(w.employees)) html += `<button class="name-btn" onclick="renderEmployee(${escapeAttr(JSON.stringify(name))})">${escapeHtml(name)}</button>`;
  html += '</div><div class="hours-info"><h3>Horaires d\'ouverture de cette semaine</h3>';
  html += DAYS.map((d,i) => `<p><strong>${d} :</strong> ${escapeHtml(openingText(w.opening[i]))}</p>`).join("") + '</div>';
  html += '<div style="text-align:center"><button class="admin-link" onclick="askPin()">🔒 Mode admin</button></div>';
  app.innerHTML = html;
}
function renderEmployee(name) {
  currentView = { type: "employee", name };
  const w = currentWeek(), sched = w.employees[name], ti = todayIndexForWeek(w);
  let html = weekNavHTML() + `<div class="topbtns"><button class="back" onclick="renderHome()">← Retour</button><strong>${escapeHtml(name)}</strong></div>`;
  sched.forEach((code, i) => {
    const s = shiftInfo(code,w);
    html += `<div class="day-card ${s.conge?'conge':''} ${i===ti?'today':''}"><div class="bar" style="background:var(--${s.color})"></div><div class="content"><div class="day">${DAYS[i]}</div><div class="hours">${escapeHtml(s.hours)}</div>${s.pause?`<div class="pause">☕ ${escapeHtml(s.pause)}</div>`:''}</div></div>`;
  });
  app.innerHTML = html; window.scrollTo(0,0);
}
async function askPin() {
  if (!firebaseConfigured()) return alert("Firebase n’est pas configuré.");
  if (auth && auth.currentUser) return renderAdmin();
  const email = prompt("E-mail administrateur Firebase :"); if (!email) return;
  const password = prompt("Mot de passe administrateur :"); if (!password) return;
  try {
    setSyncStatus("Connexion administrateur…");
    await auth.signInWithEmailAndPassword(email.trim(), password);
    if (!remoteDocumentExists) await saveRemote();
    renderAdmin();
  } catch (error) { console.error(error); setSyncStatus("Échec de la connexion administrateur", "error"); alert(`Connexion refusée : ${error.code || error.message}`); }
}
async function logoutAdmin() { if (auth) await auth.signOut(); renderHome(); }
function renderAdmin() {
  if (!auth || !auth.currentUser) return askPin();
  currentView = { type: "admin" };
  const w = currentWeek();
  let html = weekNavHTML();
  html += `<div class="topbtns"><button class="back" onclick="renderHome()">← Retour</button><strong>Mode admin</strong></div>`;
  html += `<div class="admin-row"><div class="lbl">Gestion des semaines (maximum 4)</div><div class="week-actions"><button onclick="addWeek()">➕ Ajouter</button><button onclick="copyWeek()">📋 Copier</button><button class="danger" onclick="deleteWeek()">🗑️ Supprimer</button></div></div>`;
  html += `<div class="admin-row"><div class="lbl">Semaine</div><label>Date du lundi</label><input type="date" id="weekDate" value="${w.id}"><label>Titre affiché</label><input type="text" id="weekInput" value="${escapeAttr(w.label)}"></div>`;
  html += `<div class="admin-row"><div class="lbl">Horaires d’ouverture de cette semaine</div><div class="opening-grid">${DAYS.map((d,i)=>`<label>${d}</label><input type="text" id="opening-${i}" value="${escapeAttr(w.opening[i] || '')}" placeholder="06:30 – 21:30 ou Fermé">`).join("")}</div></div>`;
  html += `<div class="admin-row"><div class="lbl">Import Google Sheets</div><input type="text" id="sheetUrl" placeholder="Colle le lien Google Sheets publié"><button class="btn btn-secondary" onclick="importGoogleSheet()">⬇️ Importer jusqu’à 4 semaines</button><button class="btn btn-secondary" onclick="downloadTemplate()">📄 Télécharger le modèle CSV</button><p class="note">Formats acceptés : modèle CSV ou tableau avec Personne en A1, dates en B1:H1 et définitions H1/H2/H3 sous les employés.</p></div>`;
  html += `<div class="admin-row"><div class="lbl">Gestion de l'équipe</div><button class="btn btn-secondary" onclick="addEmployee()">➕ Ajouter une personne</button></div>`;
  for (const [name,sched] of Object.entries(w.employees)) {
    html += `<div class="admin-row"><div class="lbl">${escapeHtml(name)}</div><div class="admin-grid">`;
    sched.forEach((code,i)=>{
      const isCustom = String(code).startsWith("C:");
      html += `<div class="d">${DAYS[i].slice(0,3)}</div><div><select onchange="onShiftChange(${escapeAttr(JSON.stringify(name))},${i},this)"><option value="CONGE" ${code==='CONGE'?'selected':''}>Congé</option><option value="H1" ${code==='H1'?'selected':''}>H1 (6:30–15:30)</option><option value="H2" ${code==='H2'?'selected':''}>H2 (8:00–12:30 + 15:30–20:30)</option><option value="H3" ${code==='H3'?'selected':''}>H3 (12:30–21:30)</option><option value="CUSTOM" ${isCustom?'selected':''}>Autre…</option></select><input type="text" class="custom-input ${isCustom?'':'hidden'}" id="custom-${cssSafe(name)}-${i}" value="${isCustom?escapeAttr(code.slice(2)):''}" placeholder="ex: 16:30 – 01:00" oninput="onCustomInput(${escapeAttr(JSON.stringify(name))},${i},this)"></div>`;
    });
    html += `</div><div class="employee-actions"><button class="btn-rename" onclick="renameEmployee(${escapeAttr(JSON.stringify(name))})">✏️ Renommer</button><button class="btn-delete" onclick="deleteEmployee(${escapeAttr(JSON.stringify(name))})">🗑️ Supprimer</button></div></div>`;
  }
  html += `<button class="btn btn-primary" onclick="saveAdmin()">💾 Enregistrer et synchroniser</button><button class="btn btn-secondary" onclick="logoutAdmin()">🚪 Déconnexion</button>`;
  app.innerHTML = html; window.scrollTo(0,0);
}
function syncAdminFields() {
  const w = currentWeek();
  const date = document.getElementById("weekDate")?.value;
  const label = document.getElementById("weekInput")?.value;
  if (date && date !== w.id) {
    if (data.weeks.some(x => x.id === date)) return alert("Une semaine existe déjà à cette date."), false;
    w.id = date; data.selectedWeekId = date; data.weeks.sort((a,b)=>a.id.localeCompare(b.id));
  }
  if (label) w.label = label;
  DAYS.forEach((_,i)=>{ const el=document.getElementById(`opening-${i}`); if(el) w.opening[i]=el.value.trim() || "Fermé"; });
  return true;
}
function onShiftChange(name,i,sel) {
  const w=currentWeek(), custom=document.getElementById(`custom-${cssSafe(name)}-${i}`);
  if(sel.value==='CUSTOM'){custom.classList.remove('hidden');w.employees[name][i]='C:'+custom.value;} else {custom.classList.add('hidden');w.employees[name][i]=sel.value;}
}
function onCustomInput(name,i,inp){currentWeek().employees[name][i]='C:'+inp.value;}
function addEmployee(){const n=prompt("Prénom :");if(!n)return;const clean=n.trim();const w=currentWeek();if(w.employees[clean])return alert("Cette personne existe déjà.");w.employees[clean]=Array(7).fill('CONGE');renderAdmin();}
function renameEmployee(oldName){const n=prompt("Nouveau prénom :",oldName);if(!n)return;const clean=n.trim(),w=currentWeek();if(w.employees[clean]&&clean!==oldName)return alert("Ce prénom existe déjà.");const obj={};Object.entries(w.employees).forEach(([k,v])=>obj[k===oldName?clean:k]=v);w.employees=obj;renderAdmin();}
function deleteEmployee(name){if(confirm(`Supprimer ${name} de cette semaine ?`)){delete currentWeek().employees[name];renderAdmin();}}
function nextAvailableWeekId(){let id=data.weeks.length?data.weeks[data.weeks.length-1].id:mondayISO();do{id=addDaysISO(id,7);}while(data.weeks.some(w=>w.id===id));return id;}
function addWeek(){if(data.weeks.length>=4)return alert("Maximum 4 semaines à l’avance.");syncAdminFields();const id=nextAvailableWeekId();const employees={};Object.keys(currentWeek().employees).forEach(n=>employees[n]=Array(7).fill('CONGE'));data.weeks.push({id,label:formatWeekLabel(id),shifts:embeddedLegacy.shifts,days:DAYS,employees,opening:defaultOpening()});data.selectedWeekId=id;renderAdmin();}
function copyWeek(){if(data.weeks.length>=4)return alert("Maximum 4 semaines.");syncAdminFields();const source=currentWeek(),id=nextAvailableWeekId();const copy=JSON.parse(JSON.stringify(source));copy.id=id;copy.label=formatWeekLabel(id);data.weeks.push(copy);data.selectedWeekId=id;renderAdmin();}
function deleteWeek(){if(data.weeks.length===1)return alert("Il faut conserver au moins une semaine.");const w=currentWeek();if(!confirm(`Supprimer ${w.label} ?`))return;data.weeks=data.weeks.filter(x=>x.id!==w.id);data.selectedWeekId=data.weeks[0].id;renderAdmin();}
async function saveAdmin(){if(!syncAdminFields())return;const ok=await saveRemote();if(ok)alert("Enregistré et synchronisé sur tous les appareils ✔");}
function sheetCsvUrl(input){const s=input.trim();if(!s)return null;if(/output=csv|tqx=out:csv/.test(s))return s;const m=s.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);if(!m)return null;const gid=(s.match(/[?&#]gid=(\d+)/)||[])[1];return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${gid?`&gid=${gid}`:''}`;}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;}else if(c==='"'){q=!q;}else if(c===','&&!q){row.push(cell.trim());cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows;}
function normalizeHeader(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();}
function parseWeekId(value){const v=String(value||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return null;}
function cellToShift(v){const s=String(v||'').trim();if(!s||/cong|repos|off/i.test(s))return 'CONGE';if(/^H[123]$/i.test(s))return s.toUpperCase();return 'C:'+s;}
function firstWorkHours(cells){
  for(const raw of cells){
    const v=String(raw||'').trim();
    if(!v || /pause|selon l.?activit/i.test(v)) continue;
    if(/\d{1,2}[:h]\d{2}\s*[–—-]\s*\d{1,2}[:h]\d{2}/i.test(v)) return v;
  }
  return '';
}
function importMatrixSheet(rows){
  const header=rows[0]||[];
  if(normalizeHeader(header[0])!=='personne') return null;
  const id=parseWeekId(header[1]);
  if(!id) throw new Error("La date du lundi en B1 n’est pas reconnue");
  const shifts=JSON.parse(JSON.stringify(embeddedLegacy.shifts));
  const employees={};
  let opening=defaultOpening();
  for(const r of rows.slice(1)){
    const label=String(r[0]||'').trim();
    if(!label) continue;
    const upper=label.toUpperCase();
    if(/^H[123]$/.test(upper)){
      const hours=firstWorkHours(r.slice(1));
      if(hours){
        const pauseCells=r.slice(1).filter(x=>/pause|\d{1,2}[:h]\d{2}\s*[–—-]\s*\d{1,2}[:h]\d{2}/i.test(String(x||'')));
        const pause=pauseCells.length>1 ? `Pause : ${pauseCells.slice(1).join(' ')}` : '';
        shifts[upper]={...shifts[upper],hours,pause};
      }
      continue;
    }
    if(/^(ouverture|opening|horaires? d.?ouverture)$/i.test(label)){
      opening=r.slice(1,8).map(v=>String(v||'').trim()||'Fermé');
      continue;
    }
    employees[label]=r.slice(1,8).map(cellToShift);
  }
  return [{id,label:formatWeekLabel(id),shifts,days:DAYS,employees,opening}];
}
async function importGoogleSheet(){
  const input=document.getElementById('sheetUrl').value,url=sheetCsvUrl(input);if(!url)return alert("Lien Google Sheets non reconnu.");
  try{
    setSyncStatus("Import Google Sheets en cours…");
    const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const rows=parseCSV(await res.text());if(rows.length<2)throw new Error("Feuille vide");
    let imported=importMatrixSheet(rows);
    if(!imported){
      const h=rows[0].map(normalizeHeader),idx={week:h.findIndex(x=>x.includes('semaine')),employee:h.findIndex(x=>x.includes('employ'))};
      const dayIdx=DAYS.map(d=>h.findIndex(x=>x===normalizeHeader(d)||x.startsWith(normalizeHeader(d).slice(0,3))));
      if(idx.week<0||idx.employee<0||dayIdx.some(i=>i<0))throw new Error("Format non reconnu : utilise le modèle ou une feuille avec Personne en A1 et les dates en B1:H1");
      const map=new Map();
      for(const r of rows.slice(1)){
        const id=parseWeekId(r[idx.week]);if(!id)continue;const emp=String(r[idx.employee]||'').trim();if(!emp)continue;
        if(!map.has(id))map.set(id,{id,label:formatWeekLabel(id),shifts:JSON.parse(JSON.stringify(embeddedLegacy.shifts)),days:DAYS,employees:{},opening:defaultOpening()});
        const w=map.get(id),vals=dayIdx.map(i=>String(r[i]||'').trim());
        if(/^(ouverture|opening|horaires? d.?ouverture)$/i.test(emp)) w.opening=vals.map(v=>v||'Fermé');
        else w.employees[emp]=vals.map(cellToShift);
      }
      imported=[...map.values()].sort((a,b)=>a.id.localeCompare(b.id)).slice(0,4);
    }
    if(!imported.length)throw new Error("Aucune semaine valide");
    const countRows=imported.reduce((n,w)=>n+Object.keys(w.employees).length,0);
    if(!confirm(`Importer ${imported.length} semaine(s) et ${countRows} ligne(s) employé ? Cela remplacera les semaines actuelles.`))return;
    data={version:4,selectedWeekId:imported[0].id,weeks:imported};await saveRemote();renderAdmin();alert("Import terminé et synchronisé ✔");
  }catch(e){console.error(e);setSyncStatus("Échec de l’import Google Sheets","error");alert(`Import impossible : ${e.message}. Vérifie que la feuille est publiée sur le Web en CSV.`);}
}
function downloadTemplate(){const lines=[['Semaine','Employé',...DAYS],['2026-07-27','OUVERTURE','06:30 – 21:30','06:30 – 21:30','06:30 – 21:30','06:30 – 21:30','06:30 – 21:30','06:30 – 21:30','06:30 – 16:00'],['2026-07-27','Tais','H1','H1','CONGE','H3','16:30 – 01:00','H2','CONGE']];const csv=lines.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'}));a.download='modele-planning-bossa-nova.csv';a.click();}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHtml(s);}
function cssSafe(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_');}
